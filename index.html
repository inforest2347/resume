<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歐瀞璞｜產品工程師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: hero (left: who / right: skills + languages) → two service categories as big tabs →
   each category = experience + yellow number tiles + service cards; a card expands to its examples
   (screens + project story, and the live LINE demo where there is one). */
:root {
  --board: #ececec; --panel: #ffffff; --well: #e0e0e0; --ink: #1e1f22; --muted: #565a61; --line: #cfcfcf;
  --sun: #f7d774; --on-sun: #1e1f22; --ok: #2f8f57; --part: #b87a00; --plan: #3a73b5;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --board: #15171a; --panel: #1f2226; --well: #2a2e33; --ink: #ecedef; --muted: #b0b5bc; --line: #3a3f46;
    --sun: #e9c45a; --ok: #5cc286; --part: #e3a83a; --plan: #78a9e6; color-scheme: dark; }
}
:root[data-theme="dark"] { --board: #15171a; --panel: #1f2226; --well: #2a2e33; --ink: #ecedef; --muted: #b0b5bc; --line: #3a3f46;
  --sun: #e9c45a; --ok: #5cc286; --part: #e3a83a; --plan: #78a9e6; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--board); color: var(--ink); font-family: var(--font-body); line-height: 1.7; font-size: 16px; overflow-x: hidden; }
a { color: inherit; text-decoration-color: var(--sun); text-decoration-thickness: 3px; text-underline-offset: 3px; }
button { font: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; position: relative; }
.disc { position: absolute; border-radius: 50%; background: var(--sun); pointer-events: none; z-index: 0; }
.err { background: #fde3df; color: #7a1d12; border-radius: 6px; padding: 12px 16px; margin: 12px 0; font-size: 14px; position: relative; z-index: 2; }
mark.todo { background: var(--sun); color: var(--on-sun); border-radius: 3px; padding: 0 5px; font-size: .9em; }

.bar { position: relative; z-index: 1; display: flex; justify-content: flex-end; padding: 16px 0 0; }
.lang { display: flex; background: var(--panel); border-radius: 999px; padding: 3px; }
.lang button { font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 3px 14px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--board); }

/* hero */
.hero { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; padding: 20px 0 26px; align-items: start; }
h1 { font-size: clamp(34px, 5vw, 46px); font-weight: 900; line-height: 1.15; margin: 0; }
h1 small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 10px; }
.role { display: inline-block; margin: 12px 0 0; font-size: 17px; font-weight: 700; background: var(--sun); color: var(--on-sun); padding: 2px 12px; border-radius: 4px; }
.tag { font-size: 19px; font-weight: 500; margin: 18px 0 0; }
.intro { color: var(--muted); margin: 8px 0 0; max-width: 44ch; }
.contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 14px; }
.card { background: var(--panel); border-radius: 8px; padding: 18px 20px; }
.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.skills h4 { margin: 0 0 4px; font-size: 13px; letter-spacing: .04em; }
.skills h4 span { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-size: 12.5px; background: var(--well); border-radius: 4px; padding: 1px 7px; }
.langs { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.langs dt { color: var(--muted); font-size: 13px; }
.langs dd { margin: 0; }

/* categories */
.cats { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 16px; }
.cat { text-align: left; color: inherit; background: var(--panel); border: 2px solid transparent; border-radius: 10px; padding: 16px 20px; cursor: pointer; display: grid; gap: 2px; }
.cat b { font-size: 20px; font-weight: 900; }
.cat span { font-size: 14px; color: var(--muted); }
.cat:hover { border-color: var(--line); }
.cat[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -5px 0 var(--sun); }

.exp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--panel); border-radius: 10px; padding: 18px 22px; margin-bottom: 14px; }
.exp p { margin: 0; max-width: 70ch; }
.nums { display: flex; gap: 10px; }
.nums div { background: var(--sun); color: var(--on-sun); border-radius: 6px; padding: 6px 12px; min-width: 96px; }
.nums b { display: block; font-family: var(--font-mono); font-size: 20px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.nums span { font-size: 12px; opacity: .75; }

.proj { background: var(--panel); border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; }
.proj h4 { margin: 0 0 10px; font-size: 15px; }
.proj h4 small { font-weight: 500; color: var(--muted); margin-left: 8px; }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.flow > div { background: var(--well); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
.flow b { display: block; font-size: 12px; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.flow ul { margin: 0; padding-left: 1.1em; }
.flow .res { background: var(--sun); color: var(--on-sun); }
.flow .res b { color: var(--on-sun); opacity: .7; }
.stack { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.stack span { font-family: var(--font-mono); font-size: 11.5px; background: var(--well); border-radius: 3px; padding: 0 7px; color: var(--muted); }
.sec-h { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .06em; margin: 22px 0 10px; }
.feature { background: var(--panel); border-radius: 12px; padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 26px; align-items: start; }
.feature + .feature { margin-top: 14px; }
.feature.wide { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
.feature h3 { margin: 0 0 4px; font-size: 20px; }
.feature .desc { margin: 0 0 12px; color: var(--muted); }
.feature ul.pts { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.feature ul.pts li { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 10px; font-size: 15px; }
.feature ul.pts li::before { content: ""; border-radius: 3px; background: var(--sun); }
.feat { display: flex; flex-wrap: wrap; gap: 4px; }
.feat span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; }
.feat span i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.feat .d i { background: var(--ok); } .feat .p i { background: var(--part); }
.imgs { display: flex; gap: 12px; }
.imgs figure { margin: 0; background: var(--well); border-radius: 10px; padding: 10px; }
.imgs.phone figure { width: 230px; }
.imgs img { width: 100%; height: auto; display: block; border-radius: 6px; }
.imgs figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.demo-btn { display: inline-flex; gap: 6px; align-items: center; margin-top: 16px; font-size: 14px; font-weight: 700; background: var(--sun); color: var(--on-sun); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.demo-wrap { grid-column: 1 / -1; padding-top: 18px; border-top: 1px dashed var(--line); }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; }
.li b { display: block; font-size: 15.5px; }
.li p { margin: 2px 0 8px; font-size: 14px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 8px; display: inline-block; }
.dot.done { background: var(--ok); } .dot.partial { background: var(--part); } .dot.plan { border: 2px solid var(--plan); } .dot.no { border: 1.5px dashed var(--muted); }
.notyet { margin: 14px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.notyet span { display: inline-flex; align-items: center; gap: 5px; }
.notyet .dot { margin: 0; }
footer { position: relative; z-index: 1; padding: 28px 0 60px; font-size: 15px; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .exp { grid-template-columns: 1fr; }
  .feature, .feature.wide { grid-template-columns: 1fr; }
  .imgs { flex-wrap: wrap; }
}
@media (max-width: 640px) {
  .cats, .list, .flow { grid-template-columns: 1fr; }
  .imgs.phone figure { width: calc(50% - 6px); }
  .skills { grid-template-columns: 1fr; }
  .nums { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="wrap">
  <span class="disc" style="width:220px;height:220px;left:-130px;top:-120px"></span>
  <header class="bar">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btn-zh">中文</button>
      <button type="button" id="btn-en">English</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<!-- 讓 config.js 裡寫成 False／True（大寫）也能運作 -->
<script>var False = false, True = true;</script>
<script src="config.js"></script>
<script src="line-demo.js"></script>
<script src="annuity-demo.js"></script>
<script>
(function () {
  var C = window.SITE_CONFIG, BROKEN = !C;
  C = C || {};
  var SHOW = C.showMissing === true;
  var lang = "zh", cat = C.defaultCategory === "admin" ? "admin" : "ops";
  var demoOn = "";

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pick(x) { if (x && typeof x === "object" && !Array.isArray(x) && ("zh" in x || "en" in x)) x = x[lang]; return x == null ? "" : String(x).trim(); }
  function get(path) { return pick(path.split(".").reduce(function (o, k) { return o == null ? undefined : o[k]; }, C)); }
  function T(zh, en) { return lang === "en" ? en : zh; }
  function li(a) { return "<ul>" + (a || []).map(function (x) { return "<li>" + esc(pick(x)) + "</li>"; }).join("") + "</ul>"; }
  function todo(l) { return SHOW ? '<mark class="todo">' + esc(l) + "</mark>" : ""; }

  function hero() {
    var name = get("person.name"), nick = get("person.nickname"), email = get("person.email"), phone = get("person.phone"), links = [];
    links.push("<span>" + esc(get("person.location")) + "</span>");
    links.push(email ? '<a href="mailto:' + esc(email) + '">' + esc(email) + "</a>" : todo("Email"));
    if (lang === "zh") links.push(phone ? "<span>" + esc(phone) + "</span>" : todo("電話"));
    [["github", "GitHub"], ["portfolio", T("作品集", "Portfolio")], ["linkedin", "LinkedIn"]].forEach(function (p) {
      var u = get("person." + p[0]); if (u) links.push('<a href="' + esc(u) + '">' + p[1] + "</a>");
    });
    var skills = (C.skills || []).map(function (s) {
      var sub = pick(s.sub);
      return "<div><h4>" + esc(s.title) + (sub ? "<span>" + esc(sub) + "</span>" : "") + '</h4><div class="chips">' + (s.items || []).map(function (i) { return "<span>" + esc(pick(i)) + "</span>"; }).join("") + "</div></div>";
    }).join("");
    var langs = (C.languages || []).map(function (l, i) { return "<dt>" + (i ? "" : T("語言", "Languages")) + "</dt><dd>" + esc(pick(l)) + "</dd>"; }).join("");
    return '<section class="hero"><div>' +
      "<h1>" + (name ? esc(name) : todo(T("姓名", "Name"))) + (nick && lang === "zh" ? "<small>（" + esc(nick) + "）</small>" : "") + "</h1>" +
      '<p class="role">' + esc(get("person.role")) + "</p>" +
      '<p class="tag">「' + esc(get("person.tagline")) + "」</p>" +
      '<p class="intro">' + esc(get("person.intro")) + "</p>" +
      '<div class="contact">' + links.join("") + "</div></div>" +
      '<div class="card"><div class="skills">' + skills + '</div><dl class="langs">' + langs + "</dl></div></section>";
  }

  function project(key) {
    var p = (C.projects || {})[key]; if (!p) return "";
    return '<div class="proj"><h4>' + T("代表專案：", "Project: ") + esc(pick(p.title)) + "<small>" + esc(pick(p.org)) + "・" + esc(pick(p.meta)) + "</small></h4>" +
      '<div class="flow"><div><b>' + T("痛點", "PAIN POINTS") + "</b>" + li(p.pains) + "</div><div><b>" + T("做法", "APPROACH") + "</b>" + li(p.approach) + '</div><div class="res"><b>' + T("成果", "RESULTS") + "</b>" + li(p.results) + "</div></div>" +
      '<div class="stack">' + (p.stack || []).map(function (s) { return "<span>" + esc(s) + "</span>"; }).join("") + "</div></div>";
  }
  function feats(it) { return '<div class="feat">' + (it.feats || []).map(function (f) { return '<span class="' + (f[0] === "p" ? "p" : "d") + '"><i></i>' + esc(pick(f[1])) + "</span>"; }).join("") + "</div>"; }
  function feature(it) {
    var shots = it.shots || [], wide = shots.some(function (x) { return x[2] === "wide"; });
    return '<article class="feature' + (wide ? " wide" : "") + '"><div><h3>' + esc(pick(it.title)) + '</h3><p class="desc">' + esc(pick(it.desc)) + "</p>" +
      ((it.points || []).length ? '<ul class="pts">' + it.points.map(function (x) { return "<li><span>" + esc(pick(x)) + "</span></li>"; }).join("") + "</ul>" : "") + feats(it) +
      (it.demo ? '<button type="button" class="demo-btn" data-demo="' + it.demo + '">' + (demoOn === it.demo ? T("■ 收起示範", "■ Hide demo") : (it.demo === "annuity" ? T("▶ 實際操作 客戶回覆網頁", "▶ Try the client reply page") : T("▶ 實際操作 LINE 示範", "▶ Try the LINE demo"))) + "</button>" : "") + "</div>" +
      '<div class="imgs' + (wide ? "" : " phone") + '">' + shots.map(function (x) { return '<figure><img src="' + esc(x[0]) + '" alt="' + esc(pick(x[1])) + '" loading="lazy"><figcaption>' + esc(pick(x[1])) + T("（示意）", " (illustrative)") + "</figcaption></figure>"; }).join("") + "</div>" +
      (it.demo && demoOn === it.demo ? '<div class="demo-wrap"><div id="' + it.demo + '-demo"></div></div>' : "") + "</article>";
  }
  function listItem(it) {
    return '<div class="li"><span class="dot ' + (it.status || "done") + '"></span><div><b>' + esc(pick(it.title)) + "</b><p>" + esc(pick(it.desc)) + "</p>" + feats(it) + "</div></div>";
  }

  function render() {
    document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
    document.getElementById("btn-zh").setAttribute("aria-pressed", String(lang === "zh"));
    document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
    document.title = (get("person.name") || "") + T("｜產品工程師", " | Product Engineer");
    var S = C.services || {}, cur = S[cat] || { items: [] };
    var html = BROKEN ? '<div class="err">' + T("config.js 載入失敗，可能有打錯的地方（例如少了逗號或引號）。", "config.js failed to load, probably a typo such as a missing comma or quote.") + "</div>" : "";
    html += hero();
    html += '<div class="cats" role="tablist">' + ["ops", "admin"].filter(function (k) { return S[k]; }).map(function (k) {
      return '<button type="button" class="cat" role="tab" data-cat="' + k + '" aria-selected="' + (cat === k) + '"><b>' + esc(pick(S[k].title)) + "</b><span>" + esc(pick(S[k].sub)) + "</span></button>";
    }).join("") + "</div>";
    html += '<section role="tabpanel"><div class="exp"><p><b>' + T("經驗：", "Experience: ") + "</b>" + esc(pick(cur.exp)) + '</p><div class="nums">' +
      (cur.nums || []).map(function (n) { return "<div><b>" + esc(n[0]) + "</b><span>" + esc(pick(n[1])) + "</span></div>"; }).join("") + "</div></div>" +
      project(cur.project);
    var fe = (cur.items || []).filter(function (it) { return (it.shots || []).length; }), ls = (cur.items || []).filter(function (it) { return !(it.shots || []).length; });
    html += '<h3 class="sec-h">' + T("重點展示", "HIGHLIGHTS") + "</h3>" + fe.map(feature).join("");
    if (ls.length) html += '<h3 class="sec-h">' + T("也能承接", "ALSO") + '</h3><div class="list">' + ls.map(listItem).join("") + "</div>";
    if ((cur.notyet || []).length || (cur.planned || []).length) {
      html += '<p class="notyet">' + ((cur.notyet || []).length ? T("尚未做過：", "Not yet: ") + cur.notyet.map(function (x) { return '<span><i class="dot no"></i>' + esc(pick(x)) + "</span>"; }).join("") : "") +
        ((cur.planned || []).length ? "　" + T("規劃中：", "Planned: ") + cur.planned.map(function (x) { return '<span><i class="dot plan"></i>' + esc(pick(x)) + "</span>"; }).join("") : "") + "</p>";
    }
    html += "</section>";
    var email = get("person.email"), phone = get("person.phone");
    html += "<footer>" + T("合作洽詢：", "Get in touch: ") + (email ? '<a href="mailto:' + esc(email) + '">' + esc(email) + "</a>" : "") + (phone && lang === "zh" ? "　" + esc(phone) : "") + "</footer>";
    document.getElementById("app").innerHTML = html;
    var ld = document.getElementById("line-demo");
    if (ld && window.LineDemo) window.LineDemo.mount(ld, lang);
    var ad = document.getElementById("annuity-demo");
    if (ad && window.AnnuityDemo) window.AnnuityDemo.mount(ad, lang);
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-cat],[data-demo]");
    if (!b) return;
    if (b.dataset.cat) { cat = b.dataset.cat; demoOn = ""; try { history.replaceState(null, "", "#" + cat); } catch (err) {} render(); return; }
    if (b.dataset.demo) {
      demoOn = demoOn === b.dataset.demo ? "" : b.dataset.demo; render();
      var d = document.getElementById(demoOn + "-demo"); if (d) d.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  function setLang(l) { lang = l === "en" ? "en" : "zh"; try { localStorage.setItem("site-lang", lang); } catch (e) {} render(); }
  document.getElementById("btn-zh").addEventListener("click", function () { setLang("zh"); });
  document.getElementById("btn-en").addEventListener("click", function () { setLang("en"); });
  window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (h === "ops" || h === "admin") { cat = h; render(); } });

  var h = location.hash.slice(1); if (h === "ops" || h === "admin") cat = h;
  var saved = null; try { saved = localStorage.getItem("site-lang"); } catch (e) {}
  lang = saved === "en" || saved === "zh" ? saved : (C.defaultLang === "en" ? "en" : "zh");
  render();
})();
</script>
</body>
</html>
